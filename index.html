<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CelticApp</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CelticApp">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --green-glow: #00ff66;
            --green-dim: #00aa44;
            --green-dark: #003311;
            --amber-glow: #ffb000;
            --red-glow: #ff2a2a;
            --blue-glow: #00bfff;
            --panel-bg: rgba(18, 22, 18, 0.90);
            --panel-border: #1e3a24;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #0b0d0b;
            background-image: 
                radial-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 0),
                linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111),
                linear-gradient(45deg, #111 25%, #080808 25%, #080808 75%, #111 75%, #111);
            background-size: 8px 8px, 16px 16px, 16px 16px;
            background-position: 0 0, 0 0, 8px 8px;
            color: var(--green-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        .card {
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(0, 255, 102, 0.05);
            padding: 15px;
            text-align: center;
            width: 100%;
            max-width: 420px;
            position: relative;
            backdrop-filter: blur(4px);
            transition: max-width 0.3s ease;
        }

        .app-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-bottom: 8px;
            border-bottom: 1px dashed var(--panel-border);
            padding-bottom: 8px;
        }

        .app-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0, 255, 102, 0.4));
            margin-bottom: 4px;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            color: var(--green-glow);
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
            text-transform: uppercase;
        }

        .mode-subtitle {
            font-size: 0.95rem;
            color: var(--amber-glow);
            font-weight: bold;
            letter-spacing: 1.5px;
            margin: 4px 0;
            text-shadow: 0 0 5px rgba(255, 176, 0, 0.4);
            text-transform: uppercase;
        }

        .status-text {
            font-size: 0.85rem;
            color: #8fae96;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .seven-segment {
            font-family: 'VT323', monospace;
            line-height: 1;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .code-display {
            font-size: 3rem;
            color: var(--amber-glow);
            letter-spacing: 4px;
            background-color: #050805;
            border: 2px solid #2a2000;
            padding: 8px;
            border-radius: 4px;
            margin: 8px 0;
            text-shadow: 0 0 10px rgba(255, 176, 0, 0.7);
        }

        .timer-display {
            font-size: 3.8rem;
            color: var(--green-glow);
            background-color: #040a05;
            border: 2px solid var(--green-dark);
            padding: 6px;
            border-radius: 4px;
            margin: 8px 0;
            letter-spacing: 4px;
            text-shadow: 0 0 12px rgba(0, 255, 102, 0.8);
        }

        .timer-paused {
            opacity: 0.5;
            border-color: var(--amber-glow) !important;
            text-shadow: 0 0 8px rgba(255, 176, 0, 0.5) !important;
        }

        .timer-expired {
            color: var(--red-glow) !important;
            border-color: #550000 !important;
            text-shadow: 0 0 15px rgba(255, 42, 42, 0.9) !important;
            animation: pulse-red 0.8s infinite alternate;
        }

        @keyframes pulse-red {
            0% { opacity: 1; box-shadow: 0 0 10px rgba(255, 42, 42, 0.4); }
            100% { opacity: 0.4; box-shadow: 0 0 25px rgba(255, 42, 42, 0.8); }
        }

        .setup-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin: 8px 0;
        }

        .setup-group {
            text-align: left;
        }

        .setup-group label {
            font-size: 0.75rem;
            color: #6b8e73;
            margin-bottom: 2px;
            display: block;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 2px 0;
            font-size: 0.95rem;
            font-family: 'Share Tech Mono', monospace;
            text-align: center;
            border-radius: 4px;
            border: 1px solid var(--panel-border);
            background-color: #080d09;
            color: var(--green-glow);
            outline: none;
            box-sizing: border-box;
        }

        input[readonly] {
            cursor: pointer;
            background-color: #0d170f;
            border-color: var(--green-dim);
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 0.9rem;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            background-color: #142817;
            color: var(--green-glow);
            border: 1px solid var(--green-dim);
            border-radius: 4px;
            cursor: pointer;
            margin: 4px 0;
        }

        button:active {
            transform: translateY(1px);
            background-color: #1e3d23;
        }

        .btn-red { background-color: #3a0d0d; color: #ff6b6b; border-color: #7a1c1c; }
        .btn-blue { background-color: #0d283a; color: #6bc2ff; border-color: #1c527a; }
        .btn-hold { background-color: #2b1f0d; color: var(--amber-glow); border-color: var(--amber-glow); }

        .wire-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 8px 0;
        }

        .btn-wire {
            width: 100%;
            margin: 0;
            font-size: 0.8rem;
            padding: 10px 2px;
        }

        .wire-red { background: linear-gradient(135deg, #4a0f0f, #280808); color: #ff8888; border-color: #ff3333; }
        .wire-blue { background: linear-gradient(135deg, #0f2b4a, #081728); color: #88ccff; border-color: #3399ff; }
        .wire-green { background: linear-gradient(135deg, #0f4a1c, #08280f); color: #88ffaa; border-color: #33ff66; }
        .wire-yellow { background: linear-gradient(135deg, #4a410f, #282308); color: #ffee88; border-color: #ffcc00; }

        .progress-container {
            width: 100%;
            background-color: #050a06;
            border-radius: 4px;
            margin: 8px 0;
            overflow: hidden;
            border: 1px solid var(--panel-border);
            height: 18px;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00aa44, #00ff66);
            transition: width 0.2s linear;
        }

        .progress-bar-amber {
            background: linear-gradient(90deg, #aa7700, #ffb000) !important;
        }

        .progress-text {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--green-glow);
            margin-bottom: 2px;
        }

        .domination-score {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin: 8px 0;
        }

        .dom-box {
            width: 48%;
            padding: 6px;
            border-radius: 4px;
            background: #080d09;
            box-sizing: border-box;
        }

        .dom-box-red { border: 2px solid #7a1c1c; }
        .dom-box-blue { border: 2px solid #1c527a; }

        .dom-title { margin: 0 0 2px 0; font-size: 0.75rem; }
        .dom-time { font-size: 1.8rem; font-weight: bold; }

        .input-inline-group {
            display: flex;
            gap: 6px;
            margin: 8px 0;
        }

        .input-inline-group input { margin: 0; }
        .input-inline-group button { margin: 0; flex-shrink: 0; width: auto; padding: 0 15px; }

        .reset-btn {
            background-color: #241010;
            color: #ff7777;
            border-color: #552222;
            margin-top: 10px;
            font-size: 0.75rem;
            padding: 6px;
            width: 70%;
        }

        .error { color: var(--red-glow); margin-top: 6px; font-weight: bold; }
        .app-version { position: absolute; bottom: 2px; left: 8px; font-size: 0.65rem; color: #3b5240; pointer-events: none; }

        /* STILI PER IL MODALE TASTIERA POP-UP */
        .keyboard-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .keyboard-card {
            background: #0a110b;
            border: 2px solid var(--green-glow);
            border-radius: 8px;
            padding: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.2);
        }

        .keyboard-display {
            font-size: 2rem;
            background: #000;
            color: var(--amber-glow);
            border: 1px solid var(--green-dim);
            padding: 8px;
            margin-bottom: 12px;
            border-radius: 4px;
            min-height: 40px;
            letter-spacing: 3px;
        }

        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .key-btn {
            padding: 12px 0;
            font-size: 1.1rem;
            margin: 0;
            background: #112214;
            border: 1px solid var(--green-dim);
            color: var(--green-glow);
        }

        .key-btn-del { background: #331111; color: #ff8888; border-color: #772222; }
        .key-btn-ok { background: #11331a; color: #88ffaa; border-color: #227744; grid-column: span 2; }
        .key-btn-close { background: #222; color: #aaa; border-color: #444; grid-column: span 2; }

        @media (orientation: landscape) {
            .card {
                max-width: 720px;
                padding: 15px 25px;
            }

            .app-logo {
                width: 42px;
                height: 42px;
                margin-bottom: 2px;
            }

            .mode-grid {
                grid-template-columns: 1fr 1fr;
            }

            .setup-grid {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            }

            .wire-container {
                grid-template-columns: repeat(4, 1fr);
            }

            .timer-display {
                font-size: 4.5rem;
            }

            .code-display {
                font-size: 3.5rem;
            }
            
            .keyboard-card {
                max-width: 480px;
            }
            
            .keyboard-grid {
                grid-template-columns: repeat(6, 1fr);
            }
            
            .key-btn-ok { grid-column: span 3; }
            .key-btn-close { grid-column: span 3; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="app-header">
        <img src="icon.png" alt="Celtic Logo" class="app-logo" onerror="this.style.display='none'">
        <h1>CELTIC APP</h1>
    </div>

    <div id="modeTitle" class="mode-subtitle">SELEZIONA MODALITÀ</div>
    <p id="instructionText" class="status-text">Scegli la tipologia di missione da avviare.</p>

    <!-- MENU SELEZIONE MODALITÀ -->
    <div id="modeMenu" class="mode-grid">
        <button onclick="setupMode('classic')">1. CLASSICA (OTP & TIMER)</button>
        <button onclick="setupMode('domination')">2. DOMINIO (CONTROLLO AREA)</button>
        <button onclick="setupMode('extraction')">3. ESTRAZIONE DATI</button>
        <button onclick="setupMode('snd')">4. SEARCH & DESTROY</button>
        <button onclick="setupMode('wires')">5. TAGLIO CAVI</button>
        <button onclick="setupMode('checkpoint')">6. CHECKPOINT</button>
    </div>

    <!-- SEZIONE SETUP COMUNE -->
    <div id="setupSection" style="display: none;">
        <div class="setup-grid">
            <div class="setup-group">
                <label>DURATA / TEMPO OBIETTIVO:</label>
                <select id="timerSelect">
                    <option value="10">10 Minuti</option>
                    <option value="15">15 Minuti</option>
                    <option value="20">20 Minuti</option>
                    <option value="30" selected>30 Minuti</option>
                    <option value="45">45 Minuti</option>
                    <option value="60">60 Minuti</option>
                </select>
            </div>

            <div id="cpSetupOptions" class="setup-group" style="display: none;">
                <label>DURATA PRESIDIO:</label>
                <select id="cpDurationSelect">
                    <option value="5" selected>5 Minuti</option>
                    <option value="10">10 Minuti</option>
                    <option value="15">15 Minuti</option>
                    <option value="20">20 Minuti</option>
                    <option value="30">30 Minuti</option>
                </select>
            </div>
        </div>

        <div id="masterCodesDisplay" style="display: none; margin: 10px 0; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 5px; border: 1px dashed var(--amber-glow);">
            <div style="font-size: 0.75rem; color: #aaa; margin-bottom: 4px;">CODICI GENERATI PER IL MASTER:</div>
            <div style="display: flex; justify-content: space-around; gap: 8px;">
                <div id="masterCode1" class="seven-segment" style="font-size: 1.3rem; color: #fff;">----</div>
                <div id="masterCode2" class="seven-segment" style="font-size: 1.3rem; color: #fff;">----</div>
                <div id="masterCode3" class="seven-segment" style="font-size: 1.3rem; color: #fff;">----</div>
            </div>
        </div>

        <div id="wireSetupOptions" class="setup-grid" style="display: none;">
            <div class="setup-group">
                <label>PASSWORD PANNELLO CAVI:</label>
                <input type="text" id="wireAccessPasswordInput" placeholder="Tocca per inserire" readonly onclick="openVirtualKeyboard(this, 'alpha')">
            </div>
            <div class="setup-group">
                <label>CAVO DISINNESCO:</label>
                <select id="correctWireSelect">
                    <option value="red">Rosso</option>
                    <option value="blue" selected>Blu</option>
                    <option value="green">Verde</option>
                    <option value="yellow">Giallo</option>
                </select>
            </div>
            <div class="setup-group">
                <label>CAVO ESPLOSIVO (BOOM):</label>
                <select id="boomWireSelect">
                    <option value="red" selected>Rosso</option>
                    <option value="blue">Blu</option>
                    <option value="green">Verde</option>
                    <option value="yellow">Giallo</option>
                </select>
            </div>
        </div>

        <button id="startSetupBtn" type="button" onclick="startSelectedMode()">AVVIA SETUP</button>
    </div>

    <!-- DISPLAY GENERICI -->
    <div id="passwordDisplay" class="code-display seven-segment" style="display: none;">----</div>
    <div id="timerDisplay" class="timer-display seven-segment" style="display: none;">00:00</div>

    <div id="checkpointCodesDisplay" style="display: none; margin: 8px 0; background: #050805; padding: 8px; border-radius: 4px; border: 2px solid #2a2000;">
        <div style="font-size: 0.75rem; color: var(--amber-glow); margin-bottom: 4px;">STATO CODICI PRESIDIO</div>
        <div style="display: flex; justify-content: space-around; gap: 8px;">
            <div id="cpCode1" class="seven-segment" style="font-size: 1.5rem; color: var(--amber-glow);">****</div>
            <div id="cpCode2" class="seven-segment" style="font-size: 1.5rem; color: var(--amber-glow);">****</div>
            <div id="cpCode3" class="seven-segment" style="font-size: 1.5rem; color: var(--amber-glow);">****</div>
        </div>
    </div>

    <div id="progressText" class="progress-text" style="display: none;">DOWNLOAD: 0%</div>
    <div id="progressContainer" class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>

    <!-- CONTROLLI VARI -->
    <div id="classicControls" style="display: none;">
        <button id="lockBtn" type="button" onclick="lockPasswordClassic()">NASCONDI E AVVIA TIMER</button>
    </div>

    <div id="unlockSection" style="display: none;">
        <div class="input-inline-group">
            <input type="text" id="otpInput" placeholder="Tocca x Inserire" readonly onclick="openVirtualKeyboard(this, currentMode === 'checkpoint' ? 'alpha' : 'numeric')">
            <button id="verifyBtn" type="button" onclick="handleOtpSubmit()">INVIA CODICE</button>
        </div>
    </div>

    <div id="wireAccessSection" style="display: none;">
        <div class="input-inline-group">
            <input type="password" id="wireAccessInput" placeholder="Password Pannello" readonly onclick="openVirtualKeyboard(this, 'alpha')">
            <button type="button" onclick="verifyWireAccess()">ACCEDI</button>
        </div>
    </div>

    <div id="dominationControls" style="display: none;">
        <div class="domination-score">
            <div class="dom-box dom-box-red">
                <h3 class="dom-title" style="color: #ff6b6b;">ROSSI</h3>
                <div id="redTimeDisplay" class="dom-time seven-segment" style="color: #ff6b6b;">00:00</div>
            </div>
            <div class="dom-box dom-box-blue">
                <h3 class="dom-title" style="color: #6bc2ff;">BLU</h3>
                <div id="blueTimeDisplay" class="dom-time seven-segment" style="color: #6bc2ff;">00:00</div>
            </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button class="btn-red" onclick="captureDomination('red')">CONQUISTA ROSSI</button>
            <button class="btn-blue" onclick="captureDomination('blue')">CONQUISTA BLU</button>
        </div>
    </div>

    <div id="sndControls" style="display: none;">
        <button id="armBtn" class="btn-red" onclick="armSND()">INNESCA ORDIGNO</button>
    </div>

    <div id="wireControls" style="display: none;">
        <div class="wire-container">
            <button class="btn-wire wire-red" onclick="cutWire('red')">CAVO ROSSO</button>
            <button class="btn-wire wire-blue" onclick="cutWire('blue')">CAVO BLU</button>
            <button class="btn-wire wire-green" onclick="cutWire('green')">CAVO VERDE</button>
            <button class="btn-wire wire-yellow" onclick="cutWire('yellow')">CAVO GIALLO</button>
        </div>
    </div>

    <div id="cpHoldSection" style="display: none;">
        <button id="cpToggleBtn" class="btn-hold" onclick="togglePresidio()">INIZIA PRESIDIO</button>
    </div>

    <div id="errorMessage" class="error"></div>

    <button id="resetMenuBtn" class="reset-btn" type="button" onclick="initApp()" style="display: none;">MENU PRINCIPALE</button>

    <div id="appVersion" class="app-version"></div>
</div>

<!-- POP-UP TASTIERA VIRTUALE -->
<div id="keyboardModal" class="keyboard-modal">
    <div class="keyboard-card">
        <div id="kbDisplay" class="keyboard-display seven-segment"></div>
        <div id="kbGrid" class="keyboard-grid"></div>
    </div>
</div>

<script>
    const SECRET_BASE32 = 'NEWG4ME4PPCELTIC';
    let currentMode = '';
    let targetPassword = '';
    let timerDurationMinutes = 30;
    let timerInterval = null;
    let totalSeconds = 0;
    let maxSeconds = 0;
    let activeDownloadSeconds = 0;
    let wakeLock = null;

    let activeDomFaction = null;
    let redSeconds = 0;
    let blueSeconds = 0;
    let domTargetSeconds = 0;

    let extractionPaused = false;
    let checkpoint33Passed = false;
    let checkpoint66Passed = false;

    let correctWire = '';
    let boomWire = '';
    let wireAccessPassword = '';

    let cpTargetCodes = [];
    let cpFoundCodes = [false, false, false];
    let secretPresidioDurationMinutes = 5;
    let cpPresidioInterval = null;
    let isPresidiando = false;
    let currentPresidioSeconds = 0;

    let alarmInterval = null;
    let audioCtx = null;

    // --- LOGICA TASTIERA VIRTUALE POP-UP ---
    let activeInputElement = null;
    let kbValue = '';

    function openVirtualKeyboard(inputElem, mode = 'numeric') {
        activeInputElement = inputElem;
        kbValue = '';
        updateKbDisplay();

        const grid = document.getElementById('kbGrid');
        grid.innerHTML = '';

        let keys = [];
        if (mode === 'numeric') {
            keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
        } else {
            keys = [
                '1', '2', '3', '4', '5', '6', '7', '8', '9', '0',
                'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'J', 'K',
                'L', 'M', 'N', 'P', 'Q', 'R', 'S', 'T', 'U', 'V',
                'W', 'X', 'Y', 'Z'
            ];
        }

        keys.forEach(k => {
            const btn = document.createElement('button');
            btn.className = 'key-btn';
            btn.type = 'button';
            btn.innerText = k;
            btn.onclick = () => {
                const maxLen = activeInputElement.getAttribute('maxlength');
                if (!maxLen || kbValue.length < parseInt(maxLen, 10)) {
                    kbValue += k;
                    updateKbDisplay();
                }
            };
            grid.appendChild(btn);
        });

        // Tasto DEL
        const delBtn = document.createElement('button');
        delBtn.className = 'key-btn key-btn-del';
        delBtn.type = 'button';
        delBtn.innerText = 'DEL';
        delBtn.onclick = () => {
            kbValue = kbValue.slice(0, -1);
            updateKbDisplay();
        };
        grid.appendChild(delBtn);

        // Tasto OK
        const okBtn = document.createElement('button');
        okBtn.className = 'key-btn key-btn-ok';
        okBtn.type = 'button';
        okBtn.innerText = 'CONFERMA';
        okBtn.onclick = () => {
            if (activeInputElement) {
                activeInputElement.value = kbValue;
            }
            closeVirtualKeyboard();
        };
        grid.appendChild(okBtn);

        // Tasto CHIUDI
        const closeBtn = document.createElement('button');
        closeBtn.className = 'key-btn key-btn-close';
        closeBtn.type = 'button';
        closeBtn.innerText = 'ANNULLA';
        closeBtn.onclick = closeVirtualKeyboard;
        grid.appendChild(closeBtn);

        document.getElementById('keyboardModal').style.display = 'flex';
    }

    function updateKbDisplay() {
        const display = document.getElementById('kbDisplay');
        if (activeInputElement && activeInputElement.type === 'password') {
            display.innerText = '*'.repeat(kbValue.length);
        } else {
            display.innerText = kbValue || '_';
        }
    }

    function startLoopingAlarm() {
        stopLoopingAlarm();
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            audioCtx = new AudioContext();

            const playBeepSequence = () => {
                if (!audioCtx) return;
                [0, 200, 400, 600].forEach((delay) => {
                    setTimeout(() => {
                        if (!audioCtx) return;
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.value = 880;
                        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.15);
                    }, delay);
                });
            };

            playBeepSequence();
            alarmInterval = setInterval(playBeepSequence, 1000);
        } catch (e) {
            console.warn('Audio non riproducibile:', e);
        }
    }

    function stopLoopingAlarm() {
        if (alarmInterval) {
            clearInterval(alarmInterval);
            alarmInterval = null;
        }
        if (audioCtx) {
            audioCtx.close().catch(() => {});
            audioCtx = null;
        }
    }

    function base32ToBuf(str) {
        const base32chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
        let bits = '';
        let hex = '';
        for (let i = 0; i < str.length; i++) {
            const val = base32chars.indexOf(str.charAt(i).toUpperCase());
            bits += val.toString(2).padStart(5, '0');
        }
        for (let i = 0; i + 4 <= bits.length; i += 4) {
            const chunk = bits.substr(i, 4);
            hex = hex + parseInt(chunk, 2).toString(16);
        }
        if (hex.length % 2 !== 0) hex = hex.substring(0, hex.length - 1);
        const binary = new Uint8Array(hex.length / 2);
        for (let i = 0; i < hex.length / 2; i++) {
            binary[i] = parseInt(hex.substr(i * 2, 2), 16);
        }
        return binary.buffer;
    }

    async function generateTOTP(secret) {
        const epoch = Math.floor(Date.now() / 1000);
        const time = Math.floor(epoch / 30);
        const timeBuf = new ArrayBuffer(8);
        const view = new DataView(timeBuf);
        view.setUint32(4, time, false);

        const keyData = base32ToBuf(secret);
        const cryptoKey = await crypto.subtle.importKey(
            'raw', keyData, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']
        );

        const signature = await crypto.subtle.sign('HMAC', cryptoKey, timeBuf);
        const sigBytes = new Uint8Array(signature);

        const offset = sigBytes[sigBytes.length - 1] & 0xf;
        const binary =
            ((sigBytes[offset] & 0x7f) << 24) |
            ((sigBytes[offset + 1] & 0xff) << 16) |
            ((sigBytes[offset + 2] & 0xff) << 8) |
            (sigBytes[offset + 3] & 0xff);

        let otp = (binary % 1000000).toString();
        return otp.padStart(6, '0');
    }

            if (matchedIndex !== -1) {

                codeElem.innerText = cpTargetCodes[matchedIndex];

        btn.classList.add('btn-hold');

        document.getElementById('instructionText').innerText = 'PRESIDIO INTERROTTO! Premi per riprovare.';
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('progressText').innerText = 'PRESIDIO: 0%';
        currentPresidioSeconds = 0;

        startGenericTimer();
    }

    function completePresidio() {
        if (cpPresidioInterval) clearInterval(cpPresidioInterval);
        if (timerInterval) clearInterval(timerInterval);
        isPresidiando = false;

        document.getElementById('cpHoldSection').style.display = 'none';
        document.getElementById('instructionText').innerText = 'PRESIDIO CONQUISTATO CON SUCCESSO! VITTORIA!';
        document.getElementById('passwordDisplay').innerText = 'PRESIDIO OK';
        document.getElementById('passwordDisplay').style.fontSize = '2rem';
        document.getElementById('passwordDisplay').style.display = 'block';
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
            .then(() => console.log('Service Worker Registrato'))
            .catch(err => console.log('Errore SW:', err));
    }

    initApp();
</script>

</body>
</html>
